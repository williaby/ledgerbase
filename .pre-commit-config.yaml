# name = .pre-commit-config.yaml
# description = Configuration for pre-commit hooks: linting, formatting, type-checking, secret scanning, and file health
# category = ci
# usage = Automatically run on git commit and push to enforce code standards and security policies
# behavior = Defines repositories and hooks to run (e.g., ruff, ruff-format, basedpyright, detect-secrets, file hygiene)
# inputs = Staged files, pipeline triggers (commit, push)
# outputs = Modified files (via fixes), hook exit codes indicating pass/fail
# dependencies = pre-commit framework, ruff, basedpyright, detect-secrets
# author = Byron Williams
# last_modified = 2026-05-15
# tags = ci, automation, security, linting, formatting, type-checking
# changelog = Migrated to ruff/ruff-format (replaces black/flake8/isort) and basedpyright; all rev fields SHA-pinned (redirects #82)

default_language_version:
  python: python3.11

default_stages: [pre-commit]

exclude: |
  ^(
    \.venv/
    | \.idea/
    | \.nox/
    | \.pytest_cache/
    | dist/
    | build/
    | .*\.egg-info/
    | .*\.pyc
    | __pycache__/
    | notebooks/.ipynb_checkpoints/
    | migrations/
    | static/
  )/

repos:
  # ┌───────────────────────────────────────────────────┐
  # │ Ruff: linting (replaces flake8 + isort) and       │
  # │ formatting (replaces black). One tool, both jobs. │
  # └───────────────────────────────────────────────────┘
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 5e2fb545eba1ea9dc051f6f962d52fe8f76a9794  # v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ┌───────────────────────────────────────────────────┐
  # │ basedpyright: type checking                       │
  # └───────────────────────────────────────────────────┘
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1cff7801632f3aab46714b98ddeb6042615726ee  # 1.39.4
    hooks:
      - id: basedpyright

  # ┌───────────────────────────────────────────────────┐
  # │ Secret scanning                                   │
  # └───────────────────────────────────────────────────┘
  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ┌───────────────────────────────────────────────────┐
  # │ File hygiene                                      │
  # └───────────────────────────────────────────────────┘
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # ┌───────────────────────────────────────────────────┐
  # │ Project-local hooks (Nox-driven heavy scans and   │
  # │ custom validation scripts)                        │
  # └───────────────────────────────────────────────────┘
  - repo: local
    hooks:
      - id: bandit
        name: Bandit (via Nox)
        entry: uv run nox -rs bandit_scan
        language: system
        types: [python]
        pass_filenames: false

      - id: semgrep
        name: Semgrep (via Nox)
        entry: uv run nox -rs semgrep_ci
        language: system
        pass_filenames: false

      - id: vulture
        name: Vulture (via Nox)
        entry: uv run nox -rs vulture
        language: system
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck (via Nox)
        entry: uv run nox -rs shellcheck
        language: system
        pass_filenames: false

      - id: codespell
        name: Codespell (via Nox lint_other)
        entry: uv run nox -rs lint_other
        language: system
        types: [python, yaml, markdown]
        pass_filenames: false

      - id: pip-audit
        name: pip-audit (project-installed)
        entry: uv run pip-audit
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: validate-env-prod-sops
        name: Validate Required Keys in .env.prod.sops.yaml
        entry: ./validate_env_keys.sh
        language: script
        files: ^\.env\.prod\.sops\.yaml$

      - id: forbid-new-env-prod
        name: Forbid .env.prod commits
        entry: bash -c 'grep -q "SNYK_TOKEN" "$@" && echo "Committing .env.prod with secrets is forbidden." && exit 1 || exit 0' --
        language: system
        types: [file]
        files: ^\.env\.prod$

      - id: convert-headers
        name: Convert legacy headers to YAML front-matter
        entry: scripts/convert_headers.py
        language: script
        files: ^docs/.*\.md$
        stages: [manual]

      - id: check-front-matter
        name: Validate YAML front-matter
        entry: python scripts/check_front_matter.py
        language: python
        additional_dependencies:
          - pyyaml

      - id: forbid-plain-json
        name: Forbid decrypted JSON commits
        entry: bash -c 'echo "Decrypted JSON files (.plain.json) must not be committed." && exit 1'
        language: system
        files: \.plain\.json$
