---
# Front-Matter for GitHub Workflow Template

title: "Assured OSS Authentication"
name: "assured-oss-auth.yml"
description: "Configures authentication for Google Artifact Registry and uv for Assured OSS"
category: workflow
usage: "Include as a reusable workflow in GitHub Actions"
behavior: "Authenticates to Google Cloud and configures uv for Assured OSS"
inputs: "credentials_json, configure_index"
outputs: "none"
dependencies: "google-github-actions/auth, keyring, keyrings.google-artifactregistry-auth"
author: "Byron Williams"
last_modified: "2023-11-15"
changelog: "Added front-matter according to annotation spec"
tags: [workflow, authentication, assured-oss]
---

on:
  workflow_call:
    inputs:
      credentials_json:
        description: "Service account JSON for Google Artifact Registry (base64 or raw)."
        required: true
        type: string
      configure_index:
        description: "Whether to configure uv to use Assured OSS (true/false)."
        required: false
        type: boolean
        default: true
    secrets:
      GCP_SA_JSON:
        description: "Service account JSON secret mapped from repository secrets."
        required: true
        type: string

jobs:
  auth_and_configure:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ inputs.credentials_json }}

      - name: Install Artifact Registry keyring backend
        shell: bash
        run: |
          uv tool install keyring --with keyrings.google-artifactregistry-auth

      - name: Configure uv for Assured OSS
        if: ${{ inputs.configure_index }}
        shell: bash
        run: |
          {
            echo "UV_INDEX_URL=https://us-python.pkg.dev/cloud-aoss/cloud-aoss-python/simple"
            echo "UV_EXTRA_INDEX_URL=https://pypi.org/simple"
            echo "UV_KEYRING_PROVIDER=subprocess"
          } >> "$GITHUB_ENV"

  verify_assured:
    needs: auth_and_configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no public PyPI fallbacks
        shell: bash
        run: |
          nox -s verify_assured

