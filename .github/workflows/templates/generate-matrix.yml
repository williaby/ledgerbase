name: Generate Security Session Matrix

on:
  workflow_call:
    outputs:
      sessions:
        description: "Discovered security-related nox sessions"
        value: ${{ jobs.generate.outputs.sessions }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare uv & Assured OSS
    uses: ./.github/workflows/prepare-uv.yml
    secrets:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

  generate:
    name: Discover Sessions
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.set-matrix.outputs.sessions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify no public PyPI fallback
        run: uv run nox -s verify_assured

      - name: Run session discovery
        id: discover
        run: |
          uv run nox -s list-security-sessions > matrix.json
          echo "Discovered sessions:"
          cat matrix.json

      - name: Validate and export matrix
        id: set-matrix
        run: |
          if [ ! -s matrix.json ]; then
            echo "::error::No sessions discovered."
            exit 1
          fi
          sessions=$(cat matrix.json)
          echo "sessions=$sessions" >> $GITHUB_OUTPUT
