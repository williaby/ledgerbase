name: Run Lint Session Matrix

on:
  workflow_call:
    inputs:
      sessions:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare uv & Assured OSS
    uses: ./.github/workflows/prepare-uv.yml
    secrets:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

  lint-matrix:
    name: Run ${{ matrix.session }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(inputs.sessions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify no public PyPI fallback
        run: uv run nox -s verify_assured

      - name: Run lint session
        env:
          SESSION: ${{ matrix.session }}
        run: |
          uv run nox -s "$SESSION"
