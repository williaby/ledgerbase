# name = pyproject.toml
# description = Project configuration file for packaging, linting, formatting, and build settings
# category = dev
# usage = Used by uv, Ruff, and other tools for project configuration
# behavior = Defines project metadata, dependencies, and tool configurations
# inputs = none
# outputs = none
# dependencies = uv, hatchling, Ruff, MyPy, semantic-release
# author = LedgerBase Team
# last_modified = 2026-05-29 # Migrated to uv (PEP 621)
# changelog = Converted to PEP 621 [project] + PEP 735 [dependency-groups]; hatchling build backend

[project]
name = "ledgerbase"
version = "0.1.0"
description = "A financial ledger and budgeting application."
authors = [{ name = "Byron Williams" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "Flask>=3.1.0,<4.0.0",
  "Flask-SQLAlchemy>=3.1.1,<4.0.0",
  "cryptography>=44.0.2,<45.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "sentry-sdk[flask]>=2.25.1,<3.0.0",
  "marshmallow>=3.21.2,<4.0.0",
  "Flask-Limiter>=3.5.0,<4.0.0",
  "gunicorn>=23.0.0,<24.0.0",
  "psycopg[binary]>=3.1.18,<4.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "plaid-python>=30.0.0,<31.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "jinja2>=3.1.6,<3.2.0",
  "requests>=2.31.0,<3.0.0",
  "semgrep>=1.119.0,<2.0.0",
  "keyring>=24.0.0,<25.0.0",
  "keyrings.google-artifactregistry-auth>=1.1.2,<2.0.0",
  "packaging>=23.1,<24.0",
]

[dependency-groups]
dev = [
  # Core testing & linting
  "pytest>=8.3.5,<9.0.0",
  "pytest-cov>=6.1.1,<7.0.0",
  "ruff>=0.11.7,<0.12.0",
  "mypy>=1.15.0,<2.0.0",
  "basedpyright>=1.0",
  "pre-commit>=4.2.0,<5.0.0",
  "sqlfluff>=3.4.0,<4.0.0",
  "nox>=2025.2.9,<2026.0.0",

  # Security scanning tools
  "bandit>=1.8.3,<2.0.0",
  "safety>=3.4.0,<4.0.0",

  # Security report formatters
  "bandit-sarif-formatter>=1.1.1,<2.0.0",
  "sarif-tools>=3.0.4,<4.0.0",

  # Documentation tools
  "sphinx>=8.2.0,<9.0.0",
  "sphinxcontrib-plantuml>=0.25,<0.26",
  "readthedocs-sphinx-search>=0.3.2,<0.4.0",
  "sphinxcontrib-spelling>=7.2,<8.0.0",
  "sphinx-lint>=0.8,<0.9",
  "myst-parser>=4.0.1",
  "furo>=2024.8.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-autodoc-typehints>=3.1.0",

  # Other dev utilities
  "codespell>=2.1,<3.0.0",
  "pip-licenses>=4.4.0,<5.0.0",
  "python-semantic-release>=9.21.0,<10.0.0",
  "twine>=5.1.0,<6.0.0",
  "vulture>=2.11,<3.0.0",
  "yamllint>=1.35.1,<2.0.0",
  "types-requests>=2.31.0.10,<3.0.0",
  "pathspec>=0.12.1,<0.13.0",
  "pydantic>=2.9.0,<2.10.0",
  "PyGithub>=1.59.0,<2.0.0",
  "contourpy>=1.3.2,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerbase"]

[tool.ruff]
# core formatter settings—no linter config here any more
target-version = "py312"
line-length    = 88
fix            = true
show-fixes     = true

[tool.ruff.format]
quote-style         = "double"
line-ending         = "auto"
docstring-code-format = true
indent-style        = "space"

[tool.ruff.lint]
# which error codes to check
select = ["ALL"]

# codes to suppress everywhere
ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "T201",   # print() used
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "D205",   # Docstring under triple quotes should be on the same line
  "D400",   # First line of docstringshould end with a period
  "D401",   # First line of docstringshould be in imperative mood
  "D415",   # First line of docstring should not be empty
  "E265",   # Block comment should start with `# ` — suppressed due to metadata header usage
  "S", # Suppress all security-related checks as Bandit run separately
]

# directories & files to skip entirely
exclude = [
  ".git",
  ".nox",
  ".venv",
  "build",
  "dist",
  "migrations",
  "__pycache__",
  "tests",
  ".git.bak",
]

# file‑specific overrides
[tool.ruff.lint.per-file-ignores]
"annotation_spec.md" = ["E501"]


[tool.ruff.lint.isort]
known-first-party  = ["ledgerbase"]
combine-as-imports = true #

[tool.basedpyright]
# Type-check the shipped package source only. The task runner (noxfile.py),
# dev helpers (load_env.py) and one-off scripts are not part of the package and
# were never type-checked under the previous mypy scope (src only).
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false
include = ["src"]
exclude = [
  "**/__pycache__",
  ".venv",
  ".nox",
  "build",
  "dist",
  "migrations",
  "tests",
  "scripts",
  "noxfile.py",
  "load_env.py",
]

[tool.mypy.requests]
ignore_missing_imports = true #

[tool.mypy."flask.*"]
ignore_missing_imports = true #

[tool.semantic_release]
version_source = "tag"
upload_to_pypi = true
upload_to_git = true

[tool.sqlfluff]
# Dialect and Rules Configuration
dialect = "postgres"
# Using rule bundles (you can customize further)
# See: https://docs.sqlfluff.com/en/stable/configuration.html#selecting-rules
rules = "aliasing,ambiguous,capitalisation,convention,layout,naming,structure"
# Exclude migration folders if necessary (adapt path if needed)
exclude_rules = ""
# exclude_paths = "migrations/" # Uncomment if needed

# Formatting Configuration
[tool.sqlfluff.format]
# You can add specific formatting rules here if desired
# Example:
# spacing_before_equals = true
# spacing_after_equals = true


[tool.codespell]
# Comma-separated list of words to ignore
ignore-words-list = "ledgernase, PII, mycustomterm" # Add your words here

# Comma-separated list of files/patterns to skip
# skip = "*.css,*.js,./generated/*"

# Optional: Path to a file containing words to ignore (one per line)
# ignore-words-file = ".codespell_ignore_words.txt"

# Optional: Path to a file containing words to treat as correct
# dictionary-file = ".codespell_dictionary.txt"

# Check filenames as well
check-filenames = true
# Check hidden files
check-hidden = true
