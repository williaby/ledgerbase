# name = pyproject.toml
# description = Project configuration file for Poetry, linting, formatting, and build settings
# category = dev
# usage = Used by Poetry, Black, Ruff, and other tools for project configuration
# behavior = Defines project metadata, dependencies, and tool configurations
# inputs = none
# outputs = none
# dependencies = Poetry, Black, Ruff, MyPy, semantic-release
# author = LedgerBase Team
# last_modified = 2025-04-21 # Updated date
# changelog = Added missing dev dependencies from noxfile


[tool.poetry]
name = "ledgerbase"
version = "0.1.0"
description = "A financial ledger and budgeting application."
authors = ["Byron Williams"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ledgerbase", from = "src" }]

# PEP 621 metadata is mirrored alongside the Poetry config so that
# uv-based tooling (e.g. ``uv sync --frozen`` in the org-level
# python-compatibility CI matrix) can resolve dependencies. The
# canonical version-pin source remains ``[tool.poetry.dependencies]``
# below; this section just exposes the same set in PEP 621 form.
[project]
name = "ledgerbase"
version = "0.1.0"
description = "A financial ledger and budgeting application."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Byron Williams" }]
requires-python = ">=3.11,<4.0"
dependencies = [
  "Flask>=3.1.0,<4.0.0",
  "Flask-SQLAlchemy>=3.1.1,<4.0.0",
  "cryptography>=44.0.2,<45.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "sentry-sdk[flask]>=2.25.1,<3.0.0",
  "marshmallow>=3.21.2,<4.0.0",
  "Flask-Limiter>=3.5.0,<4.0.0",
  "gunicorn>=23.0.0,<24.0.0",
  "psycopg[binary]>=3.1.18,<4.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "plaid-python>=30.0.0,<31.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "jinja2>=3.1.6,<3.2.0",
  "nox>=2025.2.9",
  "requests>=2.31.0,<3.0.0",
  "semgrep>=1.119.0,<2.0.0",
  "keyring>=24.0.0,<25.0.0",
  "keyrings.google-artifactregistry-auth>=1.1.2,<2.0.0",
  "packaging>=23.1,<24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0.0",
  "pytest-cov>=6.1.1,<7.0.0",
  "ruff>=0.11.7,<0.12.0",
  "mypy>=1.15.0,<2.0.0",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
Flask = "^3.1.0"
Flask-SQLAlchemy = "^3.1.1"
cryptography = "^44.0.2"
python-dotenv = "^1.1.0"
sentry-sdk = { extras = ["flask"], version = "^2.25.1" }
marshmallow = "^3.21.2"
Flask-Limiter = "^3.5.0"
gunicorn = "^23.0.0"
psycopg = { version = "^3.1.18", extras = ["binary"] }
python-dateutil = "^2.9.0.post0"
plaid-python = "^30.0.0"
PyYAML = "^6.0.1"
jinja2 = ">=3.1.6,<3.2.0"
nox = "^2025.2.9"
requests = "^2.31.0"
semgrep = "^1.119.0"
keyring = "^24.0.0"
"keyrings.google-artifactregistry-auth" = "^1.1.2"
packaging = "^23.1"

[tool.poetry.group.dev.dependencies]
# Core testing & linting
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
ruff = "^0.11.7"
mypy = "^1.15.0"
pre-commit = "^4.2.0"
sqlfluff = "^3.4.0"
nox = "^2025.2.9"

# Security scanning tools
bandit = "^1.8.3"
safety = "^3.4.0"

# Security report formatters
bandit-sarif-formatter = "^1.1.1"
"sarif-tools" = "^3.0.4"

# Documentation tools
sphinx = "^8.2.0"
sphinxcontrib-plantuml = "^0.25"
readthedocs-sphinx-search = "^0.3.2"
sphinxcontrib-spelling = "^7.2"
sphinx-lint = "^0.8"
myst-parser = ">=4.0.1"
furo = ">=2024.8.6"
sphinx-copybutton = ">=0.5.2"
sphinx-autodoc-typehints = ">=3.1.0"

# Other dev utilities
codespell = "^2.1"
pip-licenses = "^4.4.0"
python-semantic-release = "^9.21.0"
twine = "^5.1.0"
vulture = "^2.11"
yamllint = "^1.35.1"
types-requests = "^2.31.0.10"
pathspec = "^0.12.1"
pydantic = "^2.9.0,<2.10.0"
poetry-plugin-export = "^1.8.0"
PyGithub = "^1.59.0"
contourpy = "^1.3.2"


[[tool.poetry.source]]
name     = "assured-oss"
url      = "https://us-python.pkg.dev/cloud-aoss/cloud-aoss-python/simple"
priority = "primary"

[[tool.poetry.source]]
name     = "pypi"
priority = "supplemental"

[tool.ruff]
# core formatter settings—no linter config here any more
target-version = "py312"
line-length    = 88
fix            = true
show-fixes     = true

[tool.ruff.format]
quote-style         = "double"
line-ending         = "auto"
docstring-code-format = true
indent-style        = "space"

[tool.ruff.lint]
# which error codes to check
select = ["ALL"]

# codes to suppress everywhere
ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "T201",   # print() used
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "D205",   # Docstring under triple quotes should be on the same line
  "D400",   # First line of docstringshould end with a period
  "D401",   # First line of docstringshould be in imperative mood
  "D415",   # First line of docstring should not be empty
  "E265",   # Block comment should start with `# ` — suppressed due to metadata header usage
  "S", # Suppress all security-related checks as Bandit run separately
]

# directories & files to skip entirely
exclude = [
  ".git",
  ".nox",
  ".venv",
  "build",
  "dist",
  "migrations",
  "__pycache__",
  ".git.bak",
]

# file‑specific overrides
[tool.ruff.lint.per-file-ignores]
"annotation_spec.md" = ["E501"]
"tests/*" = [
  # Tests legitimately use literal status codes / sizes (200, 422, 7…) so
  # mandating named constants would just obscure intent.
  "PLR2004",
  # Test fixtures often defer imports to inside test bodies (to avoid
  # collection-time side-effects, to enable monkeypatching, or to keep
  # test isolation clean). Module-level-only imports don't fit that need.
  "PLC0415",
  # Pytest fixtures appear as unused arguments to the test function but
  # are required for the dependency-injection wiring -- they're "used"
  # by being requested.
  "ARG001",
  "ARG002",
  # Tests do not need a strict typing-only import block.
  "TC002",
  "TC003",
  # ``pytest.MonkeyPatch`` parameter etc. -- ANN401 is excessive in tests.
  "ANN401",
  "ANN202",
  # Marshmallow ValidationError is constructed in test routes with a
  # short literal message.
  "EM101",
  "TRY003",
  # Test fakes must mirror the third-party interface they substitute
  # (e.g. ``logging.Handler.setLevel``) and so cannot be renamed to
  # snake_case without breaking duck-typing.
  "N802",
]


[tool.ruff.lint.isort]
known-first-party  = ["ledgerbase"]
combine-as-imports = true #

[tool.mypy.requests]
ignore_missing_imports = true #

[tool.mypy."flask.*"]
ignore_missing_imports = true #

# basedpyright (read by ``pyright`` and ``basedpyright``):
# the org-level CI runs basedpyright with default strict settings.
# Tests legitimately use SQLAlchemy declarative models (whose runtime
# attributes are dynamic), Flask Response unpacking, and short
# Optional[...] expressions where a None branch is exercised by a
# different test. Use ``basic`` mode for tests so we don't fight the
# library typings, but keep ``standard`` strictness for src/.
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportCallIssue = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalSubscript = "warning"
reportArgumentType = "warning"
reportPrivateImportUsage = "warning"
reportIncompatibleMethodOverride = "warning"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedParameter = "none"

[build-system]
requires = ["poetry-core"] #
build-backend = "poetry.core.masonry.api" #

[tool.semantic_release]
version_source = "tag"
upload_to_pypi = true
upload_to_git = true

[tool.sqlfluff]
# Dialect and Rules Configuration
dialect = "postgres"
# Using rule bundles (you can customize further)
# See: https://docs.sqlfluff.com/en/stable/configuration.html#selecting-rules
rules = "aliasing,ambiguous,capitalisation,convention,layout,naming,structure"
# Exclude migration folders if necessary (adapt path if needed)
exclude_rules = ""
# exclude_paths = "migrations/" # Uncomment if needed

# Formatting Configuration
[tool.sqlfluff.format]
# You can add specific formatting rules here if desired
# Example:
# spacing_before_equals = true
# spacing_after_equals = true


[tool.codespell]
# Comma-separated list of words to ignore
ignore-words-list = "ledgernase, PII, mycustomterm" # Add your words here

# Comma-separated list of files/patterns to skip
# skip = "*.css,*.js,./generated/*"

# Optional: Path to a file containing words to ignore (one per line)
# ignore-words-file = ".codespell_ignore_words.txt"

# Optional: Path to a file containing words to treat as correct
# dictionary-file = ".codespell_dictionary.txt"

# Check filenames as well
check-filenames = true
# Check hidden files
check-hidden = true
